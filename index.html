<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Bee PDF Editor</title><link rel='stylesheet' href='style.css'></head><body>
<header><div class='brand'><b>Bee PDF</b><span>Editor</span></div><div class='actions'><button id='openBtn'>เปิด PDF</button><input id='file' type='file' accept='application/pdf' hidden><button id='undoBtn' class='ghost'>↶ Undo</button><button id='downloadBtn' class='primary' disabled>ดาวน์โหลด PDF</button></div></header>
<div class='toolbar'>
<button data-tool='select' class='active'>↖ เลือก</button><button data-tool='text'>T เพิ่มข้อความ</button><button data-tool='redact'>▰ เซ็นเซอร์</button><button data-tool='erase'>⌫ ลบ/ปิด</button><button data-tool='draw'>✎ วาด</button><button data-tool='sign'>✍ ลายเซ็น</button><button id='zoomOut'>−</button><span id='zoomLabel'>100%</span><button id='zoomIn'>＋</button>
</div>
<main><aside id='thumbs'><div class='hint'>หน้าของ PDF<br>จะแสดงที่นี่</div></aside><section id='workspace'><div id='welcome'><div class='drop'>📄<h2>แก้ไข PDF ได้ง่าย ๆ</h2><p>เพิ่มข้อความ • ปิดข้อมูล • เซ็นเอกสาร</p><button id='welcomeOpen'>เลือกไฟล์ PDF</button><small>ไฟล์ประมวลผลบนอุปกรณ์ของคุณ</small></div></div><div id='pages'></div></section></main>
<div id='signModal' class='modal hidden'><div class='dialog'><h3>สร้างลายเซ็น</h3><canvas id='signPad' width='520' height='220'></canvas><div class='row'><button id='clearSign'>ล้าง</button><button id='cancelSign'>ยกเลิก</button><button id='useSign' class='primary'>ใช้ลายเซ็น</button></div></div></div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs' type='module'></script>
<script src='https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'></script>
<script type='module' src='app.js'></script></body></html>
