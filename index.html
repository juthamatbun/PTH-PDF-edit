<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PPDF Editor</title><link rel='stylesheet' href='style.css'></head><body>
<header><div class='brand'><b>PPDF</b><span> Editor</span></div><div class='actions'><label id='openBtn' class='fileBtn' for='file'>Open PDF</label><input id='file' type='file' accept='.pdf,application/pdf'><button id='undoBtn' class='ghost'>↶ Undo</button><button id='downloadBtn' class='primary' disabled>Download PDF</button></div></header>
<div class='toolbar-wrap'><div class='toolbar'>
<button data-tool='select' class='active'><svg viewBox='0 0 24 24'><path d='M5 3l13 9-6 1 3 6-2 1-3-6-5 4z'/></svg><span>Select</span></button>
<button data-tool='text' title='Replace text area'><svg viewBox='0 0 24 24'><path d='M5 5h14M12 5v14M8 19h8'/></svg><span>Text</span></button>
<button data-tool='redact'><svg viewBox='0 0 24 24'><rect x='5' y='5' width='14' height='14' rx='1' class='fill'/></svg><span>Censor</span></button>
<button data-tool='erase' title='Delete an area from the PDF'><svg viewBox='0 0 24 24'><path d='M4 15l8-9 7 6-7 8H7zM11 20h9'/></svg><span>Delete</span></button>
<button data-tool='draw'><svg viewBox='0 0 24 24'><path d='M4 20l4-1 11-11-3-3L5 16zM14 7l3 3'/></svg><span>Draw</span></button>
<button data-tool='sign'><svg viewBox='0 0 24 24'><path d='M3 17c3-7 4-10 6-10 3 0-2 10 1 10 2 0 3-5 5-5 2 0-1 5 1 5 1 0 3-2 5-2'/></svg><span>Signature</span></button>
<div class='zoom'><button id='zoomOut'>−</button><span id='zoomLabel'>100%</span><button id='zoomIn'>＋</button></div>
</div><div id='objectBar' class='objectbar hidden'><label>Size <input id='fontSize' type='number' min='8' max='72' value='16'></label><label>Color <input id='textColor' type='color' value='#111111'></label><button id='deleteSelected'>Delete</button></div></div>
<main><aside id='thumbs'><div class='hint'>PDF pages<br>will appear here</div></aside><section id='workspace'><div id='welcome'><div class='drop'><svg class='file-svg' viewBox='0 0 48 58'><path d='M9 3h20l10 10v42H9zM29 3v11h10'/></svg><h2>Edit PDFs easily</h2><p>Add text • Redact information • Sign documents</p><label id='welcomeOpen' class='fileBtn' for='file'><svg class='folder-svg' viewBox='0 0 24 24'><path d='M3 7h7l2 2h9v10H3z'/></svg>Choose PDF</label><small>Your PDF is processed on your device</small></div></div><div id='pages'></div></section></main>
<div id='signModal' class='modal hidden'><div class='dialog'><h3>Create Signature</h3><canvas id='signPad' width='520' height='220'></canvas><div class='row'><button id='clearSign'>Clear</button><button id='cancelSign'>Cancel</button><button id='useSign' class='primary'>Use Signature</button></div></div></div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs' type='module'></script>
<script src='https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'></script>
<script type='module' src='app.js'></script></body></html>
